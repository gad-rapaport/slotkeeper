# Development database only: used by `npm run dev:server` and the integration tests.
# Separate project name and volume, so it never touches the demo stack's data.
#   docker compose -f compose.dev.yaml up -d
name: slotkeeper-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: slotkeeper
      POSTGRES_USER: slotkeeper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    command:
      [postgres, -c, shared_buffers=48MB, -c, max_connections=40, -c, fsync=off, -c, synchronous_commit=off]
    ports:
      - '127.0.0.1:54103:5432'
    volumes:
      - dev-data:/var/lib/postgresql
    shm_size: 64mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slotkeeper -d slotkeeper']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: 'no'
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: '2' }

volumes:
  dev-data:
