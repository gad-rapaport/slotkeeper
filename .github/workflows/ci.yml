name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch makes older runs pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Lint, types, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  integration:
    name: Integration tests (PostgreSQL 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: slotkeeper
          # Throwaway credential for an ephemeral CI container; not used anywhere else.
          POSTGRES_PASSWORD: ci-ephemeral
          POSTGRES_DB: slotkeeper
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U slotkeeper" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://slotkeeper:ci-ephemeral@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Runs every migration on an empty database, then the suites (including migration idempotency).
      - run: npm run test:integration

  e2e:
    name: Docker build, E2E and image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Create a throwaway .env
        run: |
          gen() { openssl rand -hex 16; }
          {
            echo "POSTGRES_PASSWORD=$(gen)"
            echo "SEED_ADMIN_PASSWORD=$(gen)"
            echo "SEED_MEMBER_PASSWORD=$(gen)"
            # E2E signs in more often than a person would; the limiter itself is covered by integration tests.
            echo "LOGIN_RATE_LIMIT_PER_MINUTE=60"
          } > .env
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: slotkeeper:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack and seed
        run: |
          docker compose up -d --wait
          docker compose --profile tools run --rm seed
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=desktop --project=mobile
        env:
          CI: 'true'
      - name: Contention simulation against the running stack
        # 30 simultaneous requests for one slot: expects exactly one booking and no 5xx.
        run: node scripts/simulate-contention.mjs --per-user 5
      - name: Image size
        run: docker image ls slotkeeper:local --format '{{.Repository}}:{{.Tag}} {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
      - name: Vulnerability scan (report)
        # Report-only: findings in the distroless/Node base layers are tracked in docs/SECURITY.md and fixed by
        # rebuilding on a newer base, not by failing unrelated pull requests.
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.75.0 \
            image --severity HIGH,CRITICAL --ignore-unfixed --no-progress slotkeeper:local | tee trivy.txt
          { echo '```'; tail -n 40 trivy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v

  security:
    name: Secret and dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (full history)
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
